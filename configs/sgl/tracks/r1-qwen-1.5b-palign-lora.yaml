# DeepSeek-R1-Distill-Qwen-1.5B on P-ALIGN's 966 traces with the LoRA recipe of the 7B/8B tracks,
# to separate the effect of the adaptation regime from model size. Shares the full-FT track's data
# dir (same tokenizer, same segmentation, so the same gains and weights).
defaults:
  - ../../common/base.yaml
  - ../../common/models/r1-qwen-1.5b.yaml
  - ../../common/data/palign-966.yaml
  - ../../common/train/lora-r16.yaml
  - ../../common/eval/palign-protocol.yaml
track: r1-qwen-1.5b-palign-lora
data_dir: data/r1-qwen-1.5b-palign
lora_adapter: true
